name: Github CI
on: [push, pull_request]
permissions:
  contents: read

#strategy:
#  matrix:
#    os: [ubuntu-14.04, ubuntu-18.04, ubuntu-latest]

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        CONF_ARGS:
          -
          - --disable-tests
          - --disable-wchar --disable-u8
          - --disable-u8 --enable-unsafe --enable-norm-compat
          - --enable-unsafe --enable-norm-compat
          - --enable-debug --enable-unsafe --enable-norm-compat --enable-gcov
          - --enable-debug --enable-unsafe --enable-norm-compat CFLAGS="-fsanitize=address"
          - --disable-nullslack --enable-warn-dmax
          - --disable-extensions CFLAGS="-march=native"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
    - run: sudo apt-get install doxygen libtext-diff-perl pkg-config
    - run: sh build-aux/autogen.sh
    - run: ./configure ${{ matrix.CONF_ARGS }}
    - if: matrix.CONF_ARGS == '--disable-wchar --disable-u8'
      name: make kernel module
      run: make -f Makefile.kernel && make clean
    - run: make
    - run: make check-log
    - name: Upload configure artifacts on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: linux-config-${{ strategy.job-index }}
        path: |
          config.h
          config.status
          config.log
        if-no-files-found: ignore
    - if: matrix.CONF_ARGS == '--disable-tests'
      name: Manually build and run bare-metal tests
      run: |
        gcc -Iinclude tests/test_baremetal_edges.c src/.libs/libsafec.a -o test_edges
        ./test_edges
    - if: ${{ contains(matrix.CONF_ARGS, '--enable-gcov') }}
      name: Run make codecov if --enable-gcov
      run: |
        sudo apt-get install libdevel-cover-perl
        make gcov
        curl -s https://codecov.io/bash -o codecov_io.sh
        chmod +x codecov_io.sh
        bash codecov_io.sh
    - if: matrix.CONF_ARGS == ''
      name: Run make distcheck
      run: |
        sudo apt-get -y install doxygen wget perl
        make distcheck
    - if: matrix.CONF_ARGS == '' && startsWith(github.ref, 'refs/tags/')
      name: Prep-Release
      run: sha256sum safeclib-*.tar.* > dist.sha256
    - if: matrix.CONF_ARGS == '' && startsWith(github.ref, 'refs/tags/')
      name: Release
      continue-on-error: true
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        body_path: dist.sha256
        files: |
          dist.sha256
          safeclib-*.tar.*
  arm-none-eabi:
    # gcc with newlib, no glibc: armv6-m Cortex-M0, run via qemu-arm semihosting
    name: arm-none-eabi newlib
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
    - run: sudo apt-get install gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-user
    - run: sh build-aux/autogen.sh
    - run: ./configure --host=arm-none-eabi --disable-shared CFLAGS="-mcpu=cortex-m0 -mthumb -O2" LDFLAGS="--specs=rdimon.specs"
    - run: make
    # known newlib/semihosting failures: no env, stdin, files, locales
    - run: >-
        make check-log LOG_COMPILER="qemu-arm -cpu cortex-m0"
        XFAIL_TESTS="t_sprintf_s t_strerrorlen_s t_vwscanf_s t_wscanf_s
        t_wcstombs_s t_mbstowcs_s t_gets_s t_vfprintf_s t_vu8scanf_s
        t_u8scanf_s t_getenv_s"
    - name: Upload configure artifacts on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: arm-none-eabi-config
        path: |
          config.h
          config.status
          config.log
        if-no-files-found: ignore
  sdcc-stm8:
    # freestanding 8-bit: sdcc for STM8 with cmake, minimal core without
    # stdio, time, env. Run in the ucsim STM8 simulator.
    name: sdcc stm8 ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            CMAKE_ARGS: -DENABLE_U8=OFF -DENABLE_EXTENSIONS=OFF
          - name: minimal u8
            CMAKE_ARGS: -DENABLE_U8=ON -DENABLE_EXTENSIONS=ON
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
    - run: sudo apt-get install sdcc sdcc-ucsim cmake
    - run: >-
        cmake -B build-stm8 -DCMAKE_TOOLCHAIN_FILE=build-aux/sdcc-stm8.cmake
        -DENABLE_MINIMAL=ON -DBUILD_SHARED_LIBS=OFF -DENABLE_WCHAR=OFF
        ${{ matrix.CMAKE_ARGS }}
    - run: cmake --build build-stm8
    - run: sh build-aux/sdcc-stm8-test.sh build-stm8
  avr-gcc:
    # freestanding 8-bit: avr-gcc with cmake, minimal core without
    # stdio, time, env. Run in the simavr AVR simulator.
    name: avr-gcc ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            CMAKE_ARGS: -DENABLE_U8=OFF -DENABLE_EXTENSIONS=OFF
          - name: minimal u8
            CMAKE_ARGS: -DENABLE_U8=ON -DENABLE_EXTENSIONS=ON
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
    - run: sudo apt-get install gcc-avr avr-libc simavr libsimavr-dev cmake
    - run: >-
        cmake -B build-avr -DCMAKE_TOOLCHAIN_FILE=build-aux/avr-gcc.cmake
        -DENABLE_MINIMAL=ON -DBUILD_SHARED_LIBS=OFF -DENABLE_WCHAR=OFF
        ${{ matrix.CMAKE_ARGS }}
    - run: cmake --build build-avr
    - run: sh build-aux/avr-sim-test.sh build-avr
  macOS:
    name: macOS
    runs-on: macOS-latest
    steps:
    - name: init
      run: brew install autoconf automake libtool
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - run: sh build-aux/autogen.sh
    - run: ./configure --disable-hardening --enable-debug
    - run: make V=1
    - run: make check-log
    - name: Upload config artifacts on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: macOS-config
        path: |
          config.h
          config.status
          config.log
        if-no-files-found: ignore
    #- run: make distcheck
  mingw:
    name: mingw ${{ matrix.msystem }}
    runs-on: windows-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # msvcrt
          - msystem: MINGW64
            pkg: mingw-w64-x86_64
            perl: mingw-w64-x86_64-perl
            triplet: x86_64-w64-mingw32
            release: true
          # msvcrt, 32bit
          - msystem: MINGW32
            pkg: mingw-w64-i686
            # no i686 perl anymore, use the msys perl
            perl: perl
            triplet: i686-w64-mingw32
            release: true
          # ucrt, same triplet as MINGW64
          - msystem: UCRT64
            pkg: mingw-w64-ucrt-x86_64
            perl: mingw-w64-ucrt-x86_64-perl
            triplet: x86_64-w64-mingw32
            release: false
    env:
      MSYS2_DIR: msys64
      MSYSTEM: ${{ matrix.msystem }}
      #PATH: "C:\%MSYS2_DIR%\%MSYSTEM%\bin;C:\%MSYS2_DIR%\usr\bin;%PATH%"
    steps:
      # see https://github.com/msys2/setup-msys2
    - name: setup-msys2
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
      with:
        msystem: ${{ matrix.msystem }}
        # keep testing msvcrt
        suppress-deprecation-warnings: msystem-mingw64 msystem-mingw32
        path-type: minimal
        update: true
        install: >-
          git
          base-devel
          coreutils
          ${{ matrix.pkg }}-toolchain
          ${{ matrix.pkg }}-libtool
          ${{ matrix.perl }}
          libtool
          autoconf-wrapper
          automake-wrapper
          zip
    - run: reg add "HKLM\Software\Microsoft\Windows\Windows Error Reporting" /f /v DontShowUI /d 1
    - run: git config --global core.autocrlf input
    - name: checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - shell: msys2 {0}
      run: sh build-aux/autogen.sh
      continue-on-error: true
    - shell: msys2 {0}
      run: ./configure --enable-debug
    - shell: msys2 {0}
      run: make V=1
    - name: Upload config artifacts on failure
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: mingw-${{ matrix.msystem }}-config
        path: |
          config.h
          config.status
          config.log
        if-no-files-found: ignore
    - shell: msys2 {0}
      run: make check-log
    - shell: msys2 {0}
      if: startsWith(github.ref, 'refs/tags/') && matrix.release
      run: make pkg; sha256sum safeclib-*-${{ matrix.triplet }}.zip > ${{ matrix.msystem }}.sha256
    - name: Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
      if: startsWith(github.ref, 'refs/tags/') && matrix.release
      with:
        append_body: true
        body_path: ${{ matrix.msystem }}.sha256
        files: |
          ${{ matrix.msystem }}.sha256
          safeclib-*-${{ matrix.triplet }}.zip
    #- name: Create Release
    #  id: create_release
    #  uses: actions/create-release@v1
    #  env:
    #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #  with:
    #    tag_name: ${{ github.ref }}
    #    release_name: Draft Release ${{ github.ref }}
    #    draft: true
    #    prerelease: false
    #- name: Upload Release Asset
    #  id: upload-release-asset
    #  uses: actions/upload-release-asset@v1
    #  env:
    #    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #  with:
    #    upload_url: ${{ steps.create_release.outputs.upload_url }}
    #    asset_path: ./configure.gz
    #    asset_name: configure.gz
    #    asset_content_type: application/gzip
  aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
            sudo apt-get update -q -y
            sudo apt-get install -y make gcc grep bash file git libtool automake autoconf \
                            libtext-diff-perl pkg-config
      - run: sh build-aux/autogen.sh
      - run: build-aux/conf-make-check.sh
  linux-cmake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 1
    - run: cmake .
    - run: make
    - run: make test || (cat Testing/Temporary/LastTest.log; false)
