# checkmake config for this repo.
#
# minphony is disabled: Makefile.am is automake *input*, not a
# hand-written Makefile like rcc's. automake itself generates the
# standard "all" and "clean" targets (and "check", not "test") from
# the primaries used here (noinst_LTLIBRARIES, pkginclude_HEADERS,
# etc.), so they're never declared by hand in Makefile.am. minphony's
# hardcoded "all"/"clean"/"test" expectation only fits a plain,
# directly-make'd Makefile such as rcc's, not an automake fragment.
[minphony]
disabled = true

# phonydeclared is disabled: every target it flags here is a standard
# automake idiom, not a genuinely missing .PHONY declaration:
#  - "$(dist_man_MANS) ::" and "docs man" build real files (generated
#    man pages, via Doxygen); marking them PHONY would force them to
#    rebuild on every invocation.
#  - "all-local"/"clean-local" are automake hook targets that automake
#    wires into the real "all"/"clean" targets of the generated
#    Makefile.in; they're never invoked directly and, per automake
#    convention, must not carry their own .PHONY entry in Makefile.am.
# checkmake has no per-target exemption for either case (see
# rules/phonydeclared/phonydeclared.go upstream) -- same rationale as
# rcc's checkmake.ini.
[phonydeclared]
disabled = true

# uniquetargets is disabled: checkmake doesn't understand automake's
# `if COND ... else ... endif` conditionals, so a target defined once
# in each (mutually exclusive) arm -- e.g. tests/Makefile.am's `tests:`
# under `if HAVE_ATTRIBUTE_DIAGNOSE_IF ... else ... endif` -- looks
# like a duplicate definition. It isn't: automake strips whichever arm
# doesn't apply before make ever sees the file.
[uniquetargets]
disabled = true
